name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: jidicula/clang-format-action@v4.13.0
        with:
          clang-format-version: '18'

  build:
    strategy:
      matrix:
        os: [  macos-latest, ubuntu-22.04, ubuntu-22.04-arm, windows-latest ]

    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Install Packages (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install llvm go google-benchmark
        ln -s "$(brew --prefix llvm)/bin/clang-tidy" "/usr/local/bin/clang-tidy"

    - name: Install Packages (Ubuntu)
      if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-22.04-arm'
      run: |
        sudo apt-get install -y clang-tidy-15

    - name: Configure GCC 12 (Ubuntu)
      if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-22.04-arm'
      run: |
        echo "CC=/usr/bin/gcc-12" >> $GITHUB_ENV
        echo "CXX=/usr/bin/g++-12" >> $GITHUB_ENV

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_POLICY_VERSION_MINIMUM="3.5" -DCMAKE_BUILD_TYPE="${{env.BUILD_TYPE}}" -DBUILD_TESTING="ON"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{matrix.os}}-build-output
        path: ${{github.workspace}}/build
        retention-days: 5

  test:
    needs: build
    strategy:
      matrix:
        os: [  macos-latest, ubuntu-22.04, ubuntu-22.04-arm, windows-latest ]

    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download Build Artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{matrix.os}}-build-output
          path: ${{github.workspace}}/build

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: |
          chmod -R +rx ${{github.workspace}}/build
          ctest -C ${{env.BUILD_TYPE}} --output-on-failure -E "benchmark"

  benchmark:
    needs: build
    strategy:
      matrix:
        os: [  macos-latest, ubuntu-22.04, ubuntu-22.04-arm, windows-latest ]

    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Download Build Artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{matrix.os}}-build-output
          path: ${{github.workspace}}/build

      - name: Benchmark
        shell: bash
        run: |
          chmod -R +rx ${{github.workspace}}/build
          ctest -C ${{env.BUILD_TYPE}} -R "benchmark"
